<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception | Server Version</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --card-bg: rgba(255, 255, 255, 0.08); --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255, 255, 255, 0.12); --success: #34d399; }
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; background: linear-gradient(125deg, #0f0c29, #302b63, #24243e); background-size: 400% 400%; animation: dreamGradient 15s ease infinite; display: flex; color: white; }
        @keyframes dreamGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        #sidebar { width: 300px; background: rgba(0,0,0,0.5); backdrop-filter: blur(30px); border-right: 1px solid var(--glass); padding: 25px; display: flex; flex-direction: column; z-index: 100; }
        #player-list-sidebar { flex: 1; overflow-y: auto; }
        .player-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; font-size: 0.85em; }
        .player-card.is-drawer { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .score-badge { border-radius: 20px; padding: 2px 10px; font-weight: 900; color: #000; font-size: 0.8em; }

        #main-stage { flex: 1; padding: 25px; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
        .game-area { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass); border-radius: 35px; padding: 25px; max-width: 900px; margin: 0 auto; }
        .game-area.your-turn { border-color: var(--primary); box-shadow: 0 0 40px var(--primary); }

        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px auto; }
        .image-card { aspect-ratio: 1; border-radius: 25px; overflow: hidden; position: relative; border: 4px solid transparent; box-shadow: 0 5px 15px rgba(0,0,0,0.3); opacity: 0; transform: translateY(15px); animation: fadeInUp 0.5s ease forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); transform: scale(0.96); }
        .image-card.correct { border-color: var(--success); }

        .reveal-header { position: absolute; top: 0; left: 0; right: 0; font-size: 9px; font-weight: 900; text-align: center; color: #000; padding: 4px; z-index: 2; }
        .reveal-footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #fff; font-size: 8px; padding: 5px; text-align: center; z-index: 2; }

        .btn-glow { width: 100%; padding: 14px; border-radius: 15px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.8em; }
        .modern-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass); background: rgba(0,0,0,0.2); color: white; margin-bottom: 10px; outline: none; }
        #timer { font-family: 'Space Grotesk'; font-size: 3.5em; font-weight: 900; color: var(--secondary); text-align: center; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-content { background: var(--bg); border: 1px solid var(--glass); padding: 25px; border-radius: 30px; width: 90%; max-width: 400px; position: relative; }
        
        @media (max-width: 900px) {
            #sidebar { display: none; }
            #main-stage { width: 100%; padding: 15px; }
            .image-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .mobile-nav { position: fixed; bottom: 25px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; z-index: 4000; }
            .nav-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid var(--glass); color: white; font-size: 24px; cursor: pointer; }
        }
        @media (min-width: 901px) { .mobile-nav { display: none; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="name-screen"><div class="login-card"><h1>PixDeception 👋</h1><input type="text" id="nick" class="modern-input" placeholder="Nickname..."><button onclick="join()" class="btn-glow">Enter</button></div></div>

<aside id="sidebar">
    <h2 style="font-family:'Space Grotesk'; color:var(--primary); margin-bottom:20px;">Dreamers</h2>
    <div id="player-list-sidebar"></div>
    <div style="margin-top:auto;">
        <button onclick="toggleModal('chat-modal')" class="btn-glow" style="margin-bottom:10px; background:rgba(255,255,255,0.05);">Chat 💬</button>
        <button onclick="toggleModal('settings-modal')" class="btn-glow" style="background:rgba(255,255,255,0.05);">Options ⚙️</button>
    </div>
</aside>

<main id="main-stage">
    <div class="game-area">
        <div id="lobby-screen" class="hidden">
            <div id="host-controls" class="hidden">
                <h2 style="margin-bottom:15px;">Host Panel</h2>
                <select id="game-mode" class="modern-input"><option value="classic">Standard</option><option value="fun">Server Version 🚀</option></select>
                <select id="win-points" class="modern-input"><option value="10">10 pts</option><option value="30" selected>30 pts</option><option value="60">60 pts</option><option value="90">90 pts</option></select>
                <select id="round-timer" class="modern-input"><option value="30">30s</option><option value="60" selected>60s</option><option value="90">90s</option></select>
                <button onclick="startGame()" class="btn-glow">Start</button>
            </div><p id="wait-msg" style="text-align:center;">Waiting for Host...</p>
        </div>
        <div id="game-screen" class="hidden">
            <div id="timer">60</div><div id="clue-display" style="text-align:center; font-weight:bold; color:var(--primary); font-size:1.4em; margin-bottom:15px;"></div>
            <div class="image-grid" id="grid"></div>
            <div id="controls">
                <div id="draw-ctrl" class="hidden"><input type="text" id="clue-in" class="modern-input" placeholder="Your clue..." autocomplete="off"><button onclick="sendAction('submitClue')" class="btn-glow">Send</button></div>
                <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow" style="background:var(--secondary)">Deceive</button></div>
                <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow" style="background:var(--success)">Vote</button></div>
            </div><div id="results-area"></div>
        </div>
    </div>
</main>

<div class="mobile-nav">
    <button class="nav-btn" onclick="toggleModal('players-modal')">👤</button>
    <button class="nav-btn" onclick="toggleModal('chat-modal')">💬</button>
    <button class="nav-btn" onclick="toggleModal('settings-modal')">⚙️</button>
</div>

<!-- Modals -->
<div id="chat-modal" class="modal"><div class="modal-content"><span onclick="toggleModal('chat-modal')" style="position:absolute; top:15px; right:20px; cursor:pointer;">✖</span><h3>Chat</h3><div id="chat-messages" style="height:250px; overflow-y:auto; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; margin-bottom:10px;"></div><div style="display:flex; gap:5px;"><input type="text" id="chat-in" class="modern-input" style="margin:0;"><button onclick="sendChat()" class="btn-glow" style="width:70px; padding:0;">Go</button></div></div></div>
<div id="players-modal" class="modal"><div class="modal-content"><span onclick="toggleModal('players-modal')" style="position:absolute; top:15px; right:20px; cursor:pointer;">✖</span><h3>Scoreboard</h3><div id="player-list-mobile"></div></div></div>
<div id="settings-modal" class="modal"><div class="modal-content"><span onclick="toggleModal('settings-modal')" style="position:absolute; top:15px; right:20px; cursor:pointer;">✖</span><h3>Settings</h3><button onclick="logout()" class="btn-glow" style="background:#ff4444; margin-top:20px;">Change Nickname</button></div></div>

<div id="leaderboard-overlay" class="hidden"><div class="login-card"><h2>Hall of Fame 🏆</h2><div id="final-list"></div><button onclick="location.reload()" class="btn-glow">Replay</button></div></div>

<script>
    let myId = localStorage.getItem('game_user_id') || ('u_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('game_user_id', myId); const socket = io(); let currentDrawerId = null, selectedImg = null;

    function getPlayerColor(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); return `hsl(${Math.abs(hash) % 360}, 75%, 75%)`; }
    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    function logout() { localStorage.removeItem('game_user_name'); location.reload(); }
    function join() { const n = document.getElementById('nick').value; if(!n) return; localStorage.setItem('game_user_name', n); socket.emit('joinGame', { userId: myId, name: n }); document.getElementById('name-screen').classList.add('hidden'); document.getElementById('lobby-screen').classList.remove('hidden'); }
    window.onload = () => { if(localStorage.getItem('game_user_name')) { document.getElementById('nick').value = localStorage.getItem('game_user_name'); join(); } };
    function startGame() { socket.emit('requestStart', { targetPoints: document.getElementById('win-points').value, roundTime: document.getElementById('round-timer').value, mode: document.getElementById('game-mode').value }); }
    function sendChat() { const i = document.getElementById('chat-in'); if(i.value) { socket.emit('sendChat', i.value); i.value = ""; } }

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar'); const mL = document.getElementById('player-list-mobile');
        sL.innerHTML = mL.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") document.getElementById('host-controls').classList.remove('hidden');
        d.players.forEach(id => {
            const c = getPlayerColor(id); const dr = (id === d.currentDrawerId) ? "is-drawer" : "";
            const h = `<div class="player-card ${dr}"><span style="color:${c}; font-weight:bold;">${d.playerNames[id]}${id===d.hostId?' 👑':''}</span><span class="score-badge" style="background:${c}">${d.scores[id]||0}</span></div>`;
            sL.innerHTML += h; mL.innerHTML += h;
        });
    });

    socket.on('timerUpdate', t => { document.getElementById('timer').innerText = t; });

    socket.on('roundStarted', d => {
        currentDrawerId = d.drawerId; document.getElementById('clue-in').value = "";
        const ga = document.querySelector('.game-area');
        if(myId === d.drawerId) { ga.classList.add('your-turn'); if(navigator.vibrate) navigator.vibrate(200); } else ga.classList.remove('your-turn');
        document.getElementById('lobby-screen').classList.add('hidden'); document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('clue-display').innerText = (myId === d.drawerId) ? "Your Turn: Pick & Clue" : `Waiting for ${d.drawerName}...`;
        document.getElementById('draw-ctrl').className = (myId === d.drawerId) ? "" : "hidden"; render(d.images, (myId === d.drawerId));
    });

    socket.on('showClue', d => { document.getElementById('clue-display').innerText = `CLUE: ${d.clue}`; if(myId !== currentDrawerId) { document.getElementById('fake-ctrl').classList.remove('hidden'); if(d.pImages) render(d.pImages, true); } });
    socket.on('startVoting', d => { document.getElementById('fake-ctrl').classList.add('hidden'); document.getElementById('clue-display').innerText = "VOTE!"; if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden'); render(d.options, (myId !== d.drawerId)); });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const u = card.querySelector('img').getAttribute('src'); let h = "";
            if(u === d.correctImage) { card.classList.add('correct'); h += `<div class="reveal-header" style="background:var(--success)">${d.drawerName} ✅</div>`; }
            else if(d.fakers[u]) { card.style.borderColor = "var(--secondary)"; h += `<div class="reveal-header" style="background:var(--secondary); color:#fff">${d.fakers[u]} 😈</div>`; }
            if(d.voteDetails[u]) h += `<div class="reveal-footer">${d.voteDetails[u].join(", ")}</div>`;
            card.insertAdjacentHTML('beforeend', h);
        });
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach((url, i) => {
            const c = document.createElement('div'); c.className = 'image-card'; c.style.animationDelay = (i*0.1)+'s';
            c.innerHTML = `<img src="${url}">`;
            if (canSelect) c.onclick = () => { document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected')); c.classList.add('selected'); selectedImg = url; };
            g.appendChild(c);
        });
    }

    function sendAction(t) {
        if (!selectedImg) return alert("Select an image first!");
        if (t === 'submitClue') { const c = document.getElementById('clue-in').value; socket.emit('submitClue', { image: selectedImg, clue: c }); document.getElementById('draw-ctrl').classList.add('hidden'); }
        else if (t === 'submitFake') { socket.emit('submitFake', selectedImg); document.getElementById('fake-ctrl').classList.add('hidden'); }
        else if (t === 'submitVote') { socket.emit('submitVote', selectedImg); document.getElementById('vote-ctrl').classList.add('hidden'); }
    }

    socket.on('newChat', d => { const c = document.getElementById('chat-messages'); const m = document.createElement('div'); m.className = 'chat-bubble'; m.innerHTML = `<b style="font-size:0.8em;color:var(--primary)">${d.sender}: </b>${d.text}`; c.appendChild(m); c.scrollTop = c.scrollHeight; });
    socket.on('gameOver', d => { document.getElementById('leaderboard-overlay').classList.remove('hidden'); const l = document.getElementById('final-list'); l.innerHTML = ""; d.leaderboard.forEach((p, i) => l.innerHTML += `<div style="display:flex;justify-content:space-between;padding:10px;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:5px;"><span>${i+1}. ${p.name}</span><b>${p.score}</b></div>`); });
</script>
</body>
</html>
