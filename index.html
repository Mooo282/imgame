<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception | Server Edition</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { 
            --bg: #0f0c29; 
            --card-bg: rgba(255, 255, 255, 0.07); 
            --primary: #a78bfa; 
            --secondary: #f472b6; 
            --glass: rgba(255, 255, 255, 0.15); 
            --success: #34d399; 
        }

        * { box-sizing: border-box; transition: transform 0.3s, opacity 0.3s; }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e); 
            background-size: 400% 400%; 
            animation: dreamGradient 15s ease infinite; 
            display: flex; 
            color: white; 
        }

        @keyframes dreamGradient { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        #sidebar { 
            width: 300px; 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(30px); 
            border-right: 1px solid var(--glass); 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
        }

        #player-list-sidebar { flex: 1; overflow-y: auto; }

        .player-card { 
            background: rgba(255,255,255,0.05); 
            padding: 12px; 
            border-radius: 15px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid transparent; 
            font-size: 0.85em; 
        }

        .player-card.is-drawer { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .score-badge { border-radius: 20px; padding: 2px 10px; font-weight: 900; color: #000; font-size: 0.8em; }

        #main-stage { flex: 1; padding: 20px; position: relative; }
        .game-area { 
            background: var(--card-bg); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass); 
            border-radius: 35px; 
            padding: 25px; 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px auto; }
        .image-card { 
            aspect-ratio: 1; 
            border-radius: 25px; 
            overflow: hidden; 
            position: relative; 
            border: 4px solid transparent; 
            cursor: pointer; 
            opacity: 0; 
            transform: translateY(20px); 
        }
        .image-card.reveal { opacity: 1; transform: translateY(0); }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); transform: scale(0.96); }
        .image-card.correct { border-color: var(--success); }

        .btn-glow { 
            width: 100%; 
            padding: 14px; 
            border-radius: 15px; 
            border: none; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 5px; 
        }

        .modern-input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--glass); 
            background: rgba(0,0,0,0.3); 
            color: white; 
            margin-bottom: 10px; 
            outline: none; 
        }

        #timer { font-size: 3em; font-weight: 900; color: var(--secondary); text-align: center; }
        #timer.low-time { color: #ff4757; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(15px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 5000; 
        }
        .modal-content { 
            background: var(--bg); 
            border: 1px solid var(--glass); 
            padding: 25px; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 400px; 
        }

        /* تنسيق الأيقونة العصرية الجديدة */
        .info-btn-modern {
            width: 45px; height: 45px;
            background: var(--glass);
            border: 1px solid var(--primary);
            border-radius: 12px;
            color: var(--primary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.2);
        }
        .info-btn-modern:hover {
            background: var(--primary); color: white;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }

        .typing-dot { font-size: 0.8em; color: var(--secondary); font-style: italic; animation: blink 1s infinite; }

        @media (max-width: 900px) {
            #sidebar { display: none !important; }
            .mobile-nav { 
                display: flex !important;
                position: fixed; 
                bottom: 0; left: 0; right: 0; 
                height: 70px; 
                background: rgba(15, 12, 41, 0.95); 
                backdrop-filter: blur(15px); 
                justify-content: space-around; 
                align-items: center; 
                z-index: 9999; 
                border-top: 1px solid var(--glass); 
            }
            #main-stage { padding-bottom: 90px !important; }
            .image-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- شاشة الاسم المتطورة (انضمام / إنشاء) -->
<div id="name-screen" style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; justify-content:center; align-items:center;">
    <div class="game-area" style="width:350px; text-align:center;">
        <h1 style="color:var(--primary)">PixDeception</h1>
        <input type="text" id="nick" class="modern-input" placeholder="Nickname...">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="toggleJoin(false)" id="btn-create-ui" class="btn-glow" style="background:rgba(255,255,255,0.1)">Create</button>
            <button onclick="toggleJoin(true)" id="btn-join-ui" class="btn-glow" style="background:rgba(255,255,255,0.1)">Join</button>
        </div>
        <div id="room-input-area" class="hidden" style="margin-top:15px;">
            <input type="text" id="room-id" class="modern-input" placeholder="Room ID...">
            <button onclick="joinGameAction(false)" class="btn-glow" style="background:var(--success)">Enter Room</button>
        </div>
        <button id="create-final-btn" onclick="joinGameAction(true)" class="btn-glow hidden">Create & Start</button>
    </div>
</div>

<aside id="sidebar">
    <div style="background:var(--glass); padding:10px; border-radius:15px; margin-bottom:20px; text-align:center;">
        <span style="font-size:0.7em; opacity:0.6;">ROOM ID</span>
        <h2 id="room-display" style="margin:5px 0; color:var(--secondary);">-----</h2>
    </div>
    <div id="player-list-sidebar"></div>
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
        <button onclick="socket.emit('toggleReady')" class="btn-glow" style="background:var(--success)">Ready Up</button>
        <div style="display:flex; gap:5px;">
            <button onclick="toggleModal('chat-modal')" class="btn-glow" style="flex:1; background:rgba(255,255,255,0.05);">Chat 💬</button>
            <button onclick="showRoomInfo()" class="info-btn-modern">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </button>
        </div>
    </div>
</aside>

<main id="main-stage">
    <div class="game-area">
        <div id="lobby-screen" class="hidden">
            <div id="host-controls" class="hidden">
                <h2>Host Panel</h2>
                <select id="game-mode" class="modern-input"><option value="classic">Standard</option></select>
                <select id="win-points" class="modern-input"><option value="30">30 pts</option></select>
                <button onclick="startGame()" class="btn-glow">Start Match</button>
            </div>
            <p id="wait-msg" style="text-align:center;">Waiting for Host...</p>
        </div>

        <div id="game-screen" class="hidden">
            <div id="timer">60</div>
            <div id="clue-display" style="text-align:center; font-weight:bold; color:var(--primary); margin-bottom:15px;"></div>
            <div class="image-grid" id="grid"></div>
            <div id="controls">
                <div id="draw-ctrl" class="hidden">
                    <input type="text" id="clue-in" class="modern-input" placeholder="Enter clue...">
                    <button onclick="sendAction('submitClue')" class="btn-glow">Submit Clue</button>
                </div>
                <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow">Confirm Fake</button></div>
                <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow">Vote Now</button></div>
            </div>
        </div>
    </div>
</main>

<div id="chat-modal" class="modal">
    <div class="modal-content">
        <span onclick="toggleModal('chat-modal')" style="float:right; cursor:pointer;">✖</span>
        <h3>Chat</h3>
        <div id="chat-messages" style="height:200px; overflow-y:auto; margin-bottom:10px; background:rgba(0,0,0,0.2); padding:10px;"></div>
        <input type="text" id="chat-in" class="modern-input" placeholder="Type message...">
        <button onclick="sendChat()" class="btn-glow">Send</button>
    </div>
</div>

<script>
    const socket = io();
    let myId = localStorage.getItem('pix_uid') || 'u_'+Math.random().toString(36).substr(2,9);
    localStorage.setItem('pix_uid', myId);
    let selectedImg = null;

    function toggleJoin(isJoin) {
        document.getElementById('room-input-area').classList.toggle('hidden', !isJoin);
        document.getElementById('create-final-btn').classList.toggle('hidden', isJoin);
    }

    function joinGameAction(isCreate) {
        const n = document.getElementById('nick').value;
        let r = isCreate ? Math.random().toString(36).substring(2, 7).toUpperCase() : document.getElementById('room-id').value.toUpperCase();
        if(!n || (!isCreate && !r)) return alert("Missing Info");
        socket.emit('joinGame', { userId: myId, name: n, room: r });
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    socket.on('initRoom', r => { document.getElementById('room-display').innerText = r; });

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar');
        sL.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") document.getElementById('host-controls').classList.remove('hidden');
        d.players.forEach(id => {
            const dr = (id === d.currentDrawerId) ? "is-drawer" : "";
            sL.innerHTML += `<div class="player-card ${dr}" id="p-${id}">
                <span>${d.playerReady[id]?'✅':'⏳'} ${d.playerNames[id]}</span>
                <span class="score-badge" style="background:#fff">${d.scores[id]||0}</span>
            </div>`;
        });
    });

    socket.on('playerTyping', d => {
        const pCard = document.getElementById(`p-${d.userId}`);
        if(pCard) {
            if(d.isTyping && !pCard.querySelector('.typing-dot')) pCard.insertAdjacentHTML('beforeend', '<span class="typing-dot">✍️</span>');
            else if(!d.isTyping && pCard.querySelector('.typing-dot')) pCard.querySelector('.typing-dot').remove();
        }
    });

    // مراقبة الكتابة
    ['chat-in', 'clue-in'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.oninput = () => socket.emit('typing', el.value.length > 0);
    });

    socket.on('roundStarted', d => {
        selectedImg = null;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        const isDrawer = (myId === d.drawerId);
        document.getElementById('draw-ctrl').classList.toggle('hidden', !isDrawer);
        document.getElementById('clue-display').innerText = isDrawer ? "YOUR TURN" : `Waiting for ${d.drawerName}...`;
        if(d.images) render(d.images, isDrawer);
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach((url, i) => {
            const c = document.createElement('div'); c.className = 'image-card'; c.innerHTML = `<img src="${url}">`;
            if(canSelect) c.onclick = () => {
                document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); selectedImg = url;
            };
            g.appendChild(c);
            setTimeout(() => c.classList.add('reveal'), i * 100);
        });
    }

    function showRoomInfo() { alert("Room: " + document.getElementById('room-display').innerText); }
    function toggleModal(id) { const m = document.getElementById(id); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; }
    function sendChat() { const i = document.getElementById('chat-in'); if(i.value) { socket.emit('sendChat', i.value); i.value = ""; socket.emit('typing', false); } }
    socket.on('newChat', d => { const c = document.getElementById('chat-messages'); c.innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`; c.scrollTop = c.scrollHeight; });
    socket.on('timerUpdate', t => { const e = document.getElementById('timer'); e.innerText = t; e.classList.toggle('low-time', t <= 10); });
</script>
</body>
</html>
