<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255, 255, 255, 0.1); --success: #34d399; }
        body { font-family: sans-serif; margin: 0; height: 100vh; background: var(--bg); color: white; display: flex; overflow: hidden; }
        #sidebar { width: 260px; background: rgba(0,0,0,0.3); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid var(--glass); }
        #main-stage { flex: 1; padding: 20px; overflow-y: auto; position: relative; padding-bottom: 100px; }
        .player-card { background: var(--glass); padding: 10px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .score-badge { background: white; color: black; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 0.9em; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .image-card { aspect-ratio: 1; border-radius: 15px; overflow: hidden; border: 4px solid transparent; cursor: pointer; position: relative; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); }
        .image-card.correct { border-color: var(--success); }
        .btn-glow { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; }
        .modern-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--glass); background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; box-sizing: border-box; }
        .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0c29; padding: 15px; display: none; justify-content: space-around; border-top: 1px solid var(--glass); z-index: 1000; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; }
        @media (max-width: 900px) { #sidebar { display: none; } .mobile-nav { display: flex; } .image-grid { grid-template-columns: repeat(2, 1fr); } }
        .hidden { display: none !important; }
        .reveal-header { position: absolute; top:0; left:0; right:0; background: rgba(0,0,0,0.7); font-size: 10px; text-align: center; padding: 4px; }
        .reveal-footer { position: absolute; bottom:0; left:0; right:0; background: rgba(0,0,0,0.8); font-size: 9px; text-align: center; padding: 4px; }
    </style>
</head>
<body>

<div id="name-screen" class="modal" style="display:flex;">
    <div class="modal-content" style="text-align:center;">
        <h2>PixDeception</h2>
        <input type="text" id="nick" class="modern-input" placeholder="Your Nickname...">
        <button onclick="join()" class="btn-glow">Enter Game</button>
    </div>
</div>

<aside id="sidebar">
    <h3>Players</h3>
    <div id="player-list-sidebar"></div>
    <div style="margin-top:auto;">
        <button onclick="socket.emit('toggleReady')" class="btn-glow" style="margin-bottom:10px; background:var(--success)">Ready ✅</button>
        <button onclick="toggleModal('chat-modal')" class="btn-glow" style="background:rgba(255,255,255,0.05);">Chat 💬</button>
    </div>
</aside>

<main id="main-stage">
    <div id="lobby-screen" class="hidden">
        <div id="host-controls" class="hidden">
            <h2>Host Panel</h2>
            <label>Winning Points:</label>
            <select id="win-points" class="modern-input">
                <option value="10">10 pts</option><option value="30" selected>30 pts</option><option value="60">60 pts</option>
            </select>
            <label>Timer:</label>
            <select id="round-timer" class="modern-input">
                <option value="30">30s</option><option value="60" selected>60s</option><option value="90">90s</option>
            </select>
            <label>Mode:</label>
            <select id="game-mode" class="modern-input">
                <option value="classic">Classic</option><option value="fun">Fun</option>
            </select>
            <button onclick="startGame()" class="btn-glow">Start Match</button>
        </div>
        <p style="text-align:center; margin-top:20px;">Waiting for Host to start...</p>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer" style="text-align:center; font-size: 2.5em; font-weight: bold; color: var(--secondary);">60</div>
        <div id="clue-display" style="text-align:center; margin: 10px; font-weight: bold; color: var(--primary);"></div>
        <div class="image-grid" id="grid"></div>
        <div id="controls">
            <div id="draw-ctrl" class="hidden"><input type="text" id="clue-in" class="modern-input" placeholder="Enter clue..."><button onclick="sendAction('submitClue')" class="btn-glow">Submit Clue</button></div>
            <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow">Deceive</button></div>
            <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow" style="background:var(--success)">Vote</button></div>
        </div>
    </div>
</main>

<div class="mobile-nav">
    <button onclick="toggleModal('players-modal')" style="background:none; border:none; color:white; font-size:22px;">👤</button>
    <button onclick="toggleModal('chat-modal')" style="background:none; border:none; color:white; font-size:22px;">💬</button>
    <button onclick="socket.emit('toggleReady')" style="background:none; border:none; color:white; font-size:22px;">✅</button>
</div>

<!-- Modals -->
<div id="chat-modal" class="modal"><div class="modal-content">
    <span onclick="toggleModal('chat-modal')" style="float:right; cursor:pointer;">✖</span>
    <h3>Chat</h3>
    <div id="chat-messages" style="height:200px; overflow-y:auto; background:rgba(0,0,0,0.2); padding:10px; margin-bottom:10px; border-radius:10px;"></div>
    <div style="display:flex; gap:5px;"><input type="text" id="chat-in" class="modern-input" style="margin:0;"><button onclick="sendChat()" class="btn-glow" style="width:60px;">Go</button></div>
</div></div>

<div id="players-modal" class="modal"><div class="modal-content"><h3>Scores</h3><div id="player-list-mobile"></div><button onclick="toggleModal('players-modal')" class="btn-glow" style="margin-top:10px;">Close</button></div></div>

<div id="leaderboard-overlay" class="modal"><div class="modal-content" style="text-align:center;"><h2>Game Over 🏆</h2><div id="final-list"></div><button onclick="location.reload()" class="btn-glow">Replay</button></div></div>

<script>
    const socket = io();
    let myId = localStorage.getItem('pix_uid') || 'u_'+Math.random().toString(36).substr(2,9);
    localStorage.setItem('pix_uid', myId);
    let selectedImg = null, currentDrawerId = null;

    function join() {
        const n = document.getElementById('nick').value; if(!n) return;
        socket.emit('joinGame', { userId: myId, name: n });
        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    function startGame() { 
        socket.emit('requestStart', { 
            targetPoints: document.getElementById('win-points').value,
            roundTime: document.getElementById('round-timer').value,
            mode: document.getElementById('game-mode').value
        }); 
    }

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar');
        const mL = document.getElementById('player-list-mobile');
        sL.innerHTML = mL.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") document.getElementById('host-controls').classList.remove('hidden');
        d.players.forEach(id => {
            const ready = d.playerReady[id] ? "✅" : "⏳";
            const score = d.scores[id] || 0;
            const h = `<div class="player-card"><span>${ready} ${d.playerNames[id]}</span><span class="score-badge">${score}</span></div>`;
            sL.innerHTML += h; mL.innerHTML += h;
        });
    });

    socket.on('roundStarted', d => {
        selectedImg = null; currentDrawerId = d.drawerId;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('clue-display').innerText = (myId === d.drawerId) ? "YOUR TURN: Pick & Clue" : "Waiting for " + d.drawerName;
        document.getElementById('draw-ctrl').className = (myId === d.drawerId) ? "" : "hidden";
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('vote-ctrl').classList.add('hidden');
        render(d.images, (myId === d.drawerId));
    });

    socket.on('showClue', d => {
        document.getElementById('clue-display').innerText = "CLUE: " + d.clue;
        if(myId !== currentDrawerId) {
            document.getElementById('fake-ctrl').classList.remove('hidden');
            if(d.pImages) render(d.pImages, true);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('fake-ctrl').classList.add('hidden');
        if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden');
        render(d.options, (myId !== d.drawerId));
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const url = card.querySelector('img').getAttribute('src');
            let h = "";
            if(url === d.correctImage) { card.classList.add('correct'); h += `<div class="reveal-header" style="background:var(--success)">ORIGINAL</div>`; }
            else if(d.fakers[url]) h += `<div class="reveal-header" style="background:var(--secondary)">${d.fakers[url]}</div>`;
            if(d.voteDetails[url]) h += `<div class="reveal-footer">${d.voteDetails[url].join(", ")}</div>`;
            card.insertAdjacentHTML('beforeend', h);
        });
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach(url => {
            const c = document.createElement('div'); c.className = 'image-card';
            c.innerHTML = `<img src="${url}">`;
            if(canSelect) c.onclick = () => {
                document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); selectedImg = url;
            };
            g.appendChild(c);
        });
    }

    function sendAction(t) {
        if(!selectedImg) return alert("Pick image!");
        if(t==='submitClue') socket.emit('submitClue', {image: selectedImg, clue: document.getElementById('clue-in').value});
        else if(t==='submitFake') socket.emit('submitFake', selectedImg);
        else if(t==='submitVote') socket.emit('submitVote', selectedImg);
        document.getElementById(t==='submitClue'?'draw-ctrl':(t==='submitFake'?'fake-ctrl':'vote-ctrl')).classList.add('hidden');
    }

    function sendChat() { const i = document.getElementById('chat-in'); if(i.value) { socket.emit('sendChat', i.value); i.value = ""; } }
    socket.on('newChat', d => { 
        const c = document.getElementById('chat-messages'); 
        c.innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`;
        c.scrollTop = c.scrollHeight;
    });
    socket.on('timerUpdate', t => document.getElementById('timer').innerText = t);
    socket.on('gameOver', d => {
        toggleModal('leaderboard-overlay');
        const l = document.getElementById('final-list'); l.innerHTML = "";
        d.leaderboard.forEach(p => l.innerHTML += `<div>${p.name}: ${p.score}</div>`);
    });
</script>
</body>
</html>
