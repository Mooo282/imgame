<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception | Rooms Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --card-bg: rgba(255, 255, 255, 0.07); --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255, 255, 255, 0.15); --success: #34d399; }
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Inter', sans-serif; margin: 0; height: 100vh; background: linear-gradient(125deg, #0f0c29, #302b63, #24243e); color: white; display: flex; overflow: hidden; }

        /* Sidebars */
        #sidebar-left { width: 260px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border-right: 1px solid var(--glass); padding: 20px; display: flex; flex-direction: column; }
        #sidebar-right { width: 280px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border-left: 1px solid var(--glass); padding: 20px; display: flex; flex-direction: column; }
        
        /* Main Stage with Scroll */
        #main-stage { flex: 1; padding: 20px; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
        
        .game-area { background: var(--card-bg); backdrop-filter: blur(25px); border-radius: 30px; padding: 20px; max-width: 800px; margin: 0 auto; border: 1px solid var(--glass); }
        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 15px 0; }
        .image-card { aspect-ratio: 1; border-radius: 15px; overflow: hidden; position: relative; border: 3px solid transparent; cursor: pointer; opacity: 0; transform: translateY(10px); }
        .image-card.reveal { opacity: 1; transform: translateY(0); }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); }
        .image-card.correct { border-color: var(--success); box-shadow: 0 0 15px var(--success); }

        .btn-glow { width: 100%; padding: 12px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .modern-input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--glass); background: rgba(0,0,0,0.3); color: white; margin-bottom: 8px; outline: none; }
        
        #timer { font-size: 2.2em; font-weight: 900; color: var(--secondary); text-align: center; }
        
        /* Chat Box with Scroll */
        .chat-box { flex: 1; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; overflow-y: auto; margin-bottom: 10px; font-size: 0.9em; scroll-behavior: smooth; }
        .player-card { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-content { background: var(--bg); border: 1px solid var(--glass); padding: 20px; border-radius: 25px; width: 90%; max-width: 380px; }
        .hidden { display: none !important; }

        /* Mobile Nav & Notification Dot */
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: rgba(15, 12, 41, 0.98); border-top: 1px solid var(--glass); justify-content: space-around; align-items: center; z-index: 4000; }
        .nav-btn { position: relative; background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .dot { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background: #ff4757; border-radius: 50%; display: none; border: 2px solid #000; }

        @media (max-width: 1000px) {
            #sidebar-left, #sidebar-right { display: none; }
            .mobile-nav { display: flex; }
            #main-stage { padding-bottom: 80px; }
            .image-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .reveal-header { position: absolute; top: 0; left: 0; right: 0; font-size: 9px; font-weight: bold; text-align: center; padding: 3px; z-index: 5; }
        .reveal-footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #fff; font-size: 9px; padding: 3px; text-align: center; }
    </style>
</head>
<body>

<div id="name-screen" class="modal" style="display:flex;">
    <div class="modal-content" style="text-align:center;">
        <h1 style="color:var(--primary); margin:0 0 15px 0;">PixDeception</h1>
        <input type="text" id="nick" class="modern-input" placeholder="Nickname...">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0;">
            <button onclick="switchTab(true)" id="t-create" class="btn-glow" style="margin:0; background:var(--primary)">Create</button>
            <button onclick="switchTab(false)" id="t-join" class="btn-glow" style="margin:0; background:var(--glass)">Join</button>
        </div>
        <div id="create-box"><button onclick="processEntry(true)" class="btn-glow">Create New Room</button></div>
        <div id="join-box" class="hidden">
            <input type="text" id="room-input" class="modern-input" placeholder="Room Code...">
            <button onclick="processEntry(false)" class="btn-glow" style="background:var(--success)">Join Game</button>
        </div>
    </div>
</div>

<aside id="sidebar-left">
    <h3 id="room-id-left" style="color:var(--primary); text-align:center; margin-top:0;">Room: ----</h3>
    <div id="player-list-left" style="flex:1; overflow-y:auto;"></div>
    <button onclick="socket.emit('toggleReady')" class="btn-glow" style="background:var(--success)">Ready Up</button>
</aside>

<main id="main-stage">
    <div class="game-area">
        <div id="lobby-screen">
            <div id="host-controls" class="hidden">
                <h3 style="text-align:center; margin-top:0;">Host Settings</h3>
                <select id="win-points" class="modern-input"><option value="30">30 pts</option></select>
                <select id="round-timer" class="modern-input"><option value="60">60s</option></select>
                <button onclick="startGame()" class="btn-glow">Start Match</button>
            </div>
            <p id="wait-msg" style="text-align:center; padding:30px; opacity:0.7;">Waiting for Host...</p>
        </div>
        <div id="game-screen" class="hidden">
            <div id="timer">60</div>
            <div id="clue-display" style="text-align:center; font-weight:bold; color:var(--primary); font-size:1.1em; margin-bottom:10px;"></div>
            <div class="image-grid" id="grid"></div>
            <div id="controls">
                <div id="draw-ctrl" class="hidden"><input type="text" id="clue-in" class="modern-input" placeholder="Clue..."><button onclick="sendAction('submitClue')" class="btn-glow">Submit</button></div>
                <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow" style="background:var(--secondary)">Submit Bait</button></div>
                <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow" style="background:var(--success)">Vote</button></div>
            </div>
        </div>
    </div>
</main>

<aside id="sidebar-right">
    <h3 style="margin-top:0; color:var(--primary);">Chat</h3>
    <div id="chat-msgs-desk" class="chat-box"></div>
    <div style="display:flex; gap:5px;">
        <input type="text" id="chat-in-desk" class="modern-input" style="margin:0; font-size:0.8em;" placeholder="Msg...">
        <button onclick="sendChat('desk')" class="btn-glow" style="width:50px; margin:0;">></button>
    </div>
</aside>

<div class="mobile-nav">
    <button class="nav-btn" onclick="toggleModal('players-modal')">👤</button>
    <button class="nav-btn" onclick="openChatMob()">💬<span id="chat-dot" class="dot"></span></button>
    <button class="nav-btn" onclick="socket.emit('toggleReady')">✅</button>
</div>

<div id="chat-modal" class="modal">
    <div class="modal-content">
        <span onclick="closeChatMob()" style="float:right; cursor:pointer;">✖</span>
        <h3>Chat</h3>
        <div id="chat-msgs-mob" class="chat-box" style="height:250px;"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="chat-in-mob" class="modern-input" style="margin:0;" placeholder="Message...">
            <button onclick="sendChat('mob')" class="btn-glow" style="width:60px; margin:0;">Send</button>
        </div>
    </div>
</div>

<div id="players-modal" class="modal">
    <div class="modal-content"><span onclick="toggleModal('players-modal')" style="float:right; cursor:pointer;">✖</span><h3 id="room-code-mob">Players</h3><div id="player-list-mob"></div></div>
</div>

<script>
    const socket = io();
    let myId = localStorage.getItem('pix_uid') || 'u_'+Math.random().toString(36).substr(2,9);
    localStorage.setItem('pix_uid', myId);
    let selectedImg = null;
    let isChatOpen = false;

    // Auto-Join logic
    window.onload = () => {
        const sN = localStorage.getItem('pix_name'), sR = localStorage.getItem('pix_room');
        if (sN && sR) {
            setTimeout(() => { socket.emit('joinGame', { roomId: sR, userId: myId, name: sN, isJoining: true }); document.getElementById('name-screen').style.display = 'none'; }, 500);
        }
    };

    socket.on('errorMsg', msg => { 
        alert(msg); 
        localStorage.removeItem('pix_room');
        location.reload(); 
    });

    function switchTab(isC) {
        document.getElementById('create-box').classList.toggle('hidden', !isC);
        document.getElementById('join-box').classList.toggle('hidden', isC);
        document.getElementById('t-create').style.background = isC ? "var(--primary)" : "var(--glass)";
        document.getElementById('t-join').style.background = !isC ? "var(--primary)" : "var(--glass)";
    }

    function processEntry(isN) {
        const n = document.getElementById('nick').value.trim();
        const r = isN ? Math.random().toString(36).substring(2, 6).toUpperCase() : document.getElementById('room-input').value.trim().toUpperCase();
        if(!n || !r) return alert("Info required!");
        localStorage.setItem('pix_name', n); localStorage.setItem('pix_room', r);
        socket.emit('joinGame', { roomId: r, userId: myId, name: n, isJoining: !isN });
        document.getElementById('name-screen').style.display = 'none';
    }

    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    
    function openChatMob() { isChatOpen = true; document.getElementById('chat-dot').style.display = 'none'; toggleModal('chat-modal'); }
    function closeChatMob() { isChatOpen = false; toggleModal('chat-modal'); }

    function startGame() {
        socket.emit('requestStart', { targetPoints: document.getElementById('win-points').value, roundTime: document.getElementById('round-timer').value, mode: 'classic' });
    }

    socket.on('updatePlayerList', d => {
        document.getElementById('room-id-left').innerText = "Room: " + d.roomId;
        document.getElementById('room-code-mob').innerText = "Players (" + d.roomId + ")";
        const lLeft = document.getElementById('player-list-left'), lMob = document.getElementById('player-list-mob');
        lLeft.innerHTML = lMob.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") document.getElementById('host-controls').classList.remove('hidden');
        else document.getElementById('host-controls').classList.add('hidden');
        d.players.forEach(id => {
            const h = `<div class="player-card ${id===d.currentDrawerId?'is-drawer':''}"><span>${d.playerReady[id]?'✅':'⏳'} ${d.playerNames[id]}</span><b>${d.scores[id]||0}</b></div>`;
            lLeft.innerHTML += h; lMob.innerHTML += h;
        });
    });

    socket.on('roundStarted', d => {
        selectedImg = null;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('clue-display').innerText = (myId === d.drawerId) ? "PICK IMAGE & CLUE" : `WAIT FOR ${d.drawerName}...`;
        document.getElementById('draw-ctrl').className = (myId === d.drawerId) ? "" : "hidden";
        render(d.images, (myId === d.drawerId));
    });

    socket.on('showClue', d => {
        document.getElementById('clue-display').innerText = `CLUE: ${d.clue}`;
        if(myId !== d.drawerId) { document.getElementById('fake-ctrl').classList.remove('hidden'); render(d.pImages, true); }
    });

    socket.on('startVoting', d => {
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('clue-display').innerText = "VOTE!";
        if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden');
        render(d.options, (myId !== d.drawerId));
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const url = card.querySelector('img').getAttribute('src');
            let h = "";
            if(url === d.correctImage) { card.classList.add('correct'); h += `<div class="reveal-header" style="background:var(--success); color:#000">ORIGINAL</div>`; }
            else if(d.fakers[url]) { card.style.borderColor = "var(--secondary)"; h += `<div class="reveal-header" style="background:var(--secondary); color:#fff">${d.fakers[url]}</div>`; }
            if(d.voteDetails[url]) h += `<div class="reveal-footer">👤 ${d.voteDetails[url].join(", ")}</div>`;
            card.insertAdjacentHTML('beforeend', h);
        });
    });

    function render(imgs, canS) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        imgs.forEach((url, i) => {
            const c = document.createElement('div'); c.className = 'image-card';
            c.innerHTML = `<img src="${url}">`;
            if (canS) c.onclick = () => { document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected')); c.classList.add('selected'); selectedImg = url; };
            g.appendChild(c); setTimeout(() => c.classList.add('reveal'), i * 80);
        });
    }

    function sendAction(t) {
        if (!selectedImg) return alert("Select!");
        if (t === 'submitClue') {
            const v = document.getElementById('clue-in').value; if(!v) return alert("Clue!");
            socket.emit('submitClue', { image: selectedImg, clue: v }); document.getElementById('draw-ctrl').classList.add('hidden');
        } else { socket.emit(t, selectedImg); document.getElementById(t === 'submitFake' ? 'fake-ctrl' : 'vote-ctrl').classList.add('hidden'); }
    }

    function sendChat(mode) {
        const i = document.getElementById(mode === 'desk' ? 'chat-in-desk' : 'chat-in-mob');
        if(i.value) { socket.emit('sendChat', i.value); i.value = ""; }
    }

    socket.on('newChat', d => {
        const html = `<div><b>${d.sender}:</b> ${d.text}</div>`;
        document.getElementById('chat-msgs-desk').innerHTML += html;
        document.getElementById('chat-msgs-mob').innerHTML += html;
        document.getElementById('chat-msgs-desk').scrollTop = document.getElementById('chat-msgs-desk').scrollHeight;
        document.getElementById('chat-msgs-mob').scrollTop = document.getElementById('chat-msgs-mob').scrollHeight;
        if(!isChatOpen && window.innerWidth <= 1000) document.getElementById('chat-dot').style.display = 'block';
    });

    socket.on('timerUpdate', t => { const e = document.getElementById('timer'); e.innerText = t; e.classList.toggle('low-time', t <= 10); });
</script>
</body>
</html>
