<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255,255,255,0.1); --success: #34d399; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 260px; background: rgba(0,0,0,0.3); border-right: 1px solid var(--glass); padding: 20px; display: flex; flex-direction: column; }
        #main { flex: 1; padding: 20px; overflow-y: auto; position: relative; }
        .game-area { background: var(--glass); border-radius: 20px; padding: 20px; max-width: 800px; margin: 0 auto; }
        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .image-card { aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 3px solid transparent; cursor: pointer; position: relative; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); }
        .image-card.correct { border-color: var(--success); }
        .btn-glow { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .modern-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--glass); background: rgba(0,0,0,0.5); color: white; margin-bottom: 10px; }
        #timer { font-size: 2em; text-align: center; color: var(--secondary); font-weight: bold; }
        .hidden { display: none !important; }
        .player-card { padding: 10px; background: var(--glass); margin-bottom: 5px; border-radius: 8px; display: flex; justify-content: space-between; }
        .reveal-header { position: absolute; top: 0; width: 100%; text-align: center; font-size: 10px; background: rgba(0,0,0,0.6); }
    </style>
</head>
<body>

<div id="name-screen" style="position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; justify-content:center; align-items:center;">
    <div class="game-area" style="width:300px;">
        <h2 style="text-align:center">PixDeception</h2>
        <input type="text" id="nick" class="modern-input" placeholder="Nickname">
        <input type="text" id="room-id" class="modern-input" placeholder="Room ID">
        <button onclick="join()" class="btn-glow">Enter Game</button>
    </div>
</div>

<aside id="sidebar">
    <h3>Players</h3>
    <div id="player-list"></div>
    <div id="chat-box" style="margin-top:auto; height: 200px; overflow-y: auto; font-size: 0.8em; background: rgba(0,0,0,0.2); padding: 5px;"></div>
    <input type="text" id="chat-in" class="modern-input" placeholder="Chat..." onkeypress="if(event.key==='Enter')sendChat()">
</aside>

<main id="main">
    <div class="game-area">
        <div id="timer">60</div>
        <h3 id="status" style="text-align:center">Waiting...</h3>
        
        <div id="lobby-ctrl" class="hidden">
            <select id="mode" class="modern-input"><option value="classic">Classic</option><option value="fun">Fun</option></select>
            <button onclick="start()" class="btn-glow">Start Game</button>
        </div>

        <div id="grid" class="image-grid"></div>

        <div id="controls">
            <div id="draw-ctrl" class="hidden">
                <input type="text" id="clue-in" class="modern-input" placeholder="Your clue...">
                <button onclick="sendAction('submitClue')" class="btn-glow">Send Clue</button>
            </div>
            <button id="fake-btn" onclick="sendAction('submitFake')" class="btn-glow hidden">Set Bait</button>
            <button id="vote-btn" onclick="sendAction('submitVote')" class="btn-glow hidden">Vote!</button>
        </div>
    </div>
</main>

<div id="game-over" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1>Game Over</h1>
    <div id="leaderboard"></div>
    <button onclick="location.reload()" class="btn-glow" style="width:200px">Play Again</button>
</div>

<script>
    const socket = io();
    let myId = 'u_' + Math.random().toString(36).substr(2, 9);
    let selectedImg = null;

    function join() {
        const n = document.getElementById('nick').value, r = document.getElementById('room-id').value;
        if(n && r) socket.emit('joinGame', { userId: myId, name: n, roomId: r });
    }

    socket.on('joinSuccess', () => document.getElementById('name-screen').classList.add('hidden'));

    socket.on('updatePlayerList', d => {
        const list = document.getElementById('player-list');
        list.innerHTML = d.players.map(id => `
            <div class="player-card ${id === d.currentDrawerId ? 'selected' : ''}">
                <span>${d.playerNames[id]}</span>
                <span>${d.scores[id]}</span>
            </div>
        `).join('');
        if(myId === d.hostId && d.gameState === "LOBBY") document.getElementById('lobby-ctrl').classList.remove('hidden');
    });

    function start() {
        socket.emit('requestStart', { 
            targetPoints: 30, 
            roundTime: 60, 
            mode: document.getElementById('mode').value 
        });
    }

    socket.on('forceGameView', () => document.getElementById('lobby-ctrl').classList.add('hidden'));

    socket.on('roundStarted', d => {
        resetUI();
        const isDrawer = (myId === d.drawerId);
        document.getElementById('status').innerText = isDrawer ? "Pick an image and give a clue" : `Waiting for ${d.drawerName}...`;
        if(isDrawer) {
            document.getElementById('draw-ctrl').classList.remove('hidden');
            render(d.images, true);
        }
    });

    socket.on('showClue', d => {
        document.getElementById('status').innerText = "CLUE: " + d.clue;
        if(myId !== d.drawerId) {
            document.getElementById('fake-btn').classList.remove('hidden');
            render(d.pImages, true);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('status').innerText = "VOTE!";
        document.getElementById('fake-btn').classList.add('hidden');
        if(myId !== d.drawerId) {
            document.getElementById('vote-btn').classList.remove('hidden');
            render(d.options, true);
        }
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-btn').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const src = card.querySelector('img').getAttribute('src');
            if(src === d.correctImage) card.classList.add('correct');
            if(d.fakers[src]) card.innerHTML += `<div class="reveal-header">${d.fakers[src]}'s Bait</div>`;
        });
    });

    function render(imgs, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        imgs.forEach(src => {
            const div = document.createElement('div');
            div.className = 'image-card';
            div.innerHTML = `<img src="${src}">`;
            if(canSelect) div.onclick = () => {
                document.querySelectorAll('.image-card').forEach(c => c.classList.remove('selected'));
                div.classList.add('selected');
                selectedImg = src;
            };
            g.appendChild(div);
        });
    }

    function sendAction(type) {
        if(!selectedImg) return alert("Select an image!");
        if(type === 'submitClue') {
            const clue = document.getElementById('clue-in').value;
            socket.emit('submitClue', { image: selectedImg, clue: clue });
            document.getElementById('draw-ctrl').classList.add('hidden');
        } else {
            socket.emit(type, selectedImg);
            document.getElementById(type === 'submitFake' ? 'fake-btn' : 'vote-btn').classList.add('hidden');
        }
        selectedImg = null;
    }

    function sendChat() {
        const i = document.getElementById('chat-in');
        socket.emit('sendChat', i.value); i.value = "";
    }

    socket.on('newChat', d => {
        document.getElementById('chat-box').innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`;
    });

    socket.on('timerUpdate', t => document.getElementById('timer').innerText = t);

    socket.on('gameOver', d => {
        document.getElementById('game-over').classList.remove('hidden');
        document.getElementById('leaderboard').innerHTML = d.leaderboard.map(p => `<div>${p.name}: ${p.score}</div>`).join('');
    });

    function resetUI() {
        document.getElementById('grid').innerHTML = "";
        document.getElementById('draw-ctrl').classList.add('hidden');
        document.getElementById('fake-btn').classList.add('hidden');
        document.getElementById('vote-btn').classList.add('hidden');
    }
</script>
</body>
</html>
