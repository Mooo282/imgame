<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255, 255, 255, 0.1); --success: #34d399; }
        body { font-family: 'Inter', sans-serif; margin: 0; height: 100vh; background: var(--bg); color: white; display: flex; overflow: hidden; }
        #sidebar { width: 280px; background: rgba(0,0,0,0.3); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid var(--glass); }
        #main-stage { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; position: relative; }
        .player-card { background: var(--glass); padding: 10px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .score-badge { background: white; color: black; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 0.8em; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; }
        .image-card { aspect-ratio: 1; border-radius: 15px; overflow: hidden; border: 3px solid transparent; cursor: pointer; position: relative; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); }
        .image-card.correct { border-color: var(--success); }
        .btn-glow { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; }
        .modern-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--glass); background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; }
        .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,12,41,0.95); padding: 10px; display: none; justify-content: space-around; z-index: 1000; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        @media (max-width: 900px) { #sidebar { display: none; } .mobile-nav { display: flex; } }
        .hidden { display: none !important; }
        .reveal-header { position: absolute; top:0; left:0; right:0; background: rgba(0,0,0,0.7); font-size: 10px; text-align: center; padding: 2px; }
        .reveal-footer { position: absolute; bottom:0; left:0; right:0; background: rgba(0,0,0,0.7); font-size: 9px; text-align: center; padding: 2px; }
    </style>
</head>
<body>

<div id="name-screen" class="modal" style="display:flex;">
    <div class="modal-content" style="text-align:center;">
        <h2>PixDeception</h2>
        <input type="text" id="nick" class="modern-input" placeholder="Your Name...">
        <button onclick="join()" class="btn-glow">Start</button>
    </div>
</div>

<aside id="sidebar">
    <h3>Players</h3>
    <div id="player-list-sidebar"></div>
    <button onclick="socket.emit('toggleReady')" class="btn-glow" style="margin-top:auto;">Toggle Ready</button>
</aside>

<main id="main-stage">
    <div id="lobby-screen" class="hidden">
        <div id="host-controls" class="hidden">
            <h3>Settings</h3>
            <select id="win-points" class="modern-input"><option value="30">30 Points</option><option value="60">60 Points</option></select>
            <button onclick="startGame()" class="btn-glow">Launch Game</button>
        </div>
        <p style="text-align:center;">Waiting in Lobby...</p>
    </div>

    <div id="game-screen" class="hidden">
        <div id="timer" style="text-align:center; font-size: 2em; color: var(--secondary);">60</div>
        <div id="clue-display" style="text-align:center; margin: 10px; color: var(--primary); font-weight: bold;"></div>
        <div class="image-grid" id="grid"></div>
        <div id="controls">
            <div id="draw-ctrl" class="hidden"><input type="text" id="clue-in" class="modern-input" placeholder="Enter clue..."><button onclick="sendAction('submitClue')" class="btn-glow">Send Clue</button></div>
            <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow">Deceive Others</button></div>
            <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow">Vote</button></div>
        </div>
    </div>
</main>

<div class="mobile-nav">
    <button onclick="toggleModal('players-modal')" style="background:none; border:none; color:white; font-size:20px;">👤</button>
    <button onclick="socket.emit('toggleReady')" style="background:none; border:none; color:white; font-size:20px;">✅</button>
</div>

<div id="players-modal" class="modal"><div class="modal-content"><h3>Scores</h3><div id="player-list-mobile"></div><button onclick="toggleModal('players-modal')" class="btn-glow" style="margin-top:10px;">Close</button></div></div>

<script>
    const socket = io();
    let myId = localStorage.getItem('p_uid') || 'u'+Math.random().toString(36).substr(2,7);
    localStorage.setItem('p_uid', myId);
    let selectedImg = null;

    function join() {
        const n = document.getElementById('nick').value;
        if(!n) return;
        socket.emit('joinGame', { userId: myId, name: n });
        document.getElementById('name-screen').style.display = 'none';
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function startGame() {
        socket.emit('requestStart', { targetPoints: document.getElementById('win-points').value });
    }

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar');
        const mL = document.getElementById('player-list-mobile');
        sL.innerHTML = mL.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") document.getElementById('host-controls').classList.remove('hidden');
        d.players.forEach(id => {
            const h = `<div class="player-card"><span>${d.playerReady[id]?'✅':'⏳'} ${d.playerNames[id]}</span><span class="score-badge">${d.scores[id]||0}</span></div>`;
            sL.innerHTML += h; mL.innerHTML += h;
        });
    });

    socket.on('roundStarted', d => {
        selectedImg = null;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('clue-display').innerText = (myId === d.drawerId) ? "YOUR TURN" : "WAITING...";
        document.getElementById('draw-ctrl').className = (myId === d.drawerId) ? "" : "hidden";
        render(d.images, (myId === d.drawerId));
    });

    socket.on('showClue', d => {
        document.getElementById('clue-display').innerText = "CLUE: " + d.clue;
        if(myId !== currentDrawerId) {
            document.getElementById('fake-ctrl').classList.remove('hidden');
            if(d.pImages) render(d.pImages, true);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('fake-ctrl').classList.add('hidden');
        if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden');
        render(d.options, (myId !== d.drawerId));
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        // تحديث النقاط فوراً من البيانات المرسلة
        const cards = document.querySelectorAll('.image-card');
        cards.forEach(card => {
            const url = card.querySelector('img').getAttribute('src');
            if(url === d.correctImage) card.classList.add('correct');
            let foot = d.voteDetails[url] ? d.voteDetails[url].join(', ') : '';
            card.insertAdjacentHTML('beforeend', `<div class="reveal-footer">${foot}</div>`);
        });
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach(url => {
            const c = document.createElement('div'); c.className = 'image-card';
            c.innerHTML = `<img src="${url}">`;
            if(canSelect) c.onclick = () => {
                document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); selectedImg = url;
            };
            g.appendChild(c);
        });
    }

    function sendAction(t) {
        if(!selectedImg) return alert("Select image!");
        if(t==='submitClue') socket.emit('submitClue', {image: selectedImg, clue: document.getElementById('clue-in').value});
        else if(t==='submitFake') socket.emit('submitFake', selectedImg);
        else if(t==='submitVote') socket.emit('submitVote', selectedImg);
        document.getElementById(t==='submitClue'?'draw-ctrl':(t==='submitFake'?'fake-ctrl':'vote-ctrl')).classList.add('hidden');
    }

    socket.on('timerUpdate', t => document.getElementById('timer').innerText = t);
</script>
</body>
</html>
