<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception | Server Edition</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { 
            --bg: #0f0c29; 
            --card-bg: rgba(255, 255, 255, 0.07); 
            --primary: #a78bfa; 
            --secondary: #f472b6; 
            --glass: rgba(255, 255, 255, 0.15); 
            --success: #34d399; 
        }

        * { box-sizing: border-box; transition: transform 0.3s, opacity 0.3s; }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e); 
            background-size: 400% 400%; 
            animation: dreamGradient 15s ease infinite; 
            display: flex; 
            color: white; 
        }

        @keyframes dreamGradient { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        #sidebar { 
            width: 300px; 
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(30px); 
            border-right: 1px solid var(--glass); 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
        }

        #player-list-sidebar { flex: 1; overflow-y: auto; }

        .player-card { 
            background: rgba(255,255,255,0.05); 
            padding: 12px; 
            border-radius: 15px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid transparent; 
            font-size: 0.85em; 
            position: relative;
        }

        .player-card.is-drawer { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .score-badge { border-radius: 20px; padding: 2px 10px; font-weight: 900; color: #000; font-size: 0.8em; background: #fff; }

        #main-stage { flex: 1; padding: 20px; position: relative; }
        .game-area { 
            background: var(--card-bg); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass); 
            border-radius: 35px; 
            padding: 25px; 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px auto; }
        .image-card { 
            aspect-ratio: 1; 
            border-radius: 25px; 
            overflow: hidden; 
            position: relative; 
            border: 4px solid transparent; 
            cursor: pointer; 
            opacity: 0; 
            transform: translateY(20px); 
        }
        .image-card.reveal { opacity: 1; transform: translateY(0); }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); transform: scale(0.96); }
        .image-card.correct { border-color: var(--success); box-shadow: 0 0 15px var(--success); }

        .btn-glow { 
            width: 100%; 
            padding: 14px; 
            border-radius: 15px; 
            border: none; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 5px; 
        }

        .modern-input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--glass); 
            background: rgba(0,0,0,0.3); 
            color: white; 
            margin-bottom: 10px; 
            outline: none; 
        }

        #timer { font-size: 3em; font-weight: 900; color: var(--secondary); text-align: center; }

        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(15px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 5000; 
        }
        .modal-content { 
            background: var(--bg); 
            border: 1px solid var(--glass); 
            padding: 25px; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 400px; 
        }
        
        .reveal-header { position: absolute; top: 0; left: 0; right: 0; font-size: 10px; font-weight: 900; text-align: center; padding: 4px; z-index: 5; }
        .reveal-footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 5px; text-align: center; }
        
        .typing-dot { font-size: 0.8em; color: var(--secondary); font-style: italic; margin-left: 5px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .info-btn-modern {
            width: 45px; height: 45px;
            background: var(--glass);
            border: 1px solid var(--primary);
            border-radius: 12px;
            color: var(--primary);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .info-btn-modern:hover { background: var(--primary); color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="name-screen" style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; justify-content:center; align-items:center;">
    <div class="game-area" style="width:350px; text-align:center;">
        <h1 style="color:var(--primary)">PixDeception</h1>
        <input type="text" id="nick" class="modern-input" placeholder="Nickname...">
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="toggleJoinUI(false)" class="btn-glow" style="background:rgba(255,255,255,0.1)">Create Room</button>
            <button onclick="toggleJoinUI(true)" class="btn-glow" style="background:rgba(255,255,255,0.1)">Join Room</button>
        </div>
        <div id="join-input-section" class="hidden" style="margin-top:15px;">
            <input type="text" id="room-id-input" class="modern-input" placeholder="Room ID...">
            <button onclick="joinGameAction(false)" class="btn-glow" style="background:var(--success)">Enter Now</button>
        </div>
        <button id="create-room-btn" onclick="joinGameAction(true)" class="btn-glow hidden">Create & Start</button>
    </div>
</div>

<aside id="sidebar">
    <div style="background:var(--glass); padding:10px; border-radius:15px; margin-bottom:20px; text-align:center;">
        <span style="font-size:0.7em; opacity:0.6;">ROOM ID</span>
        <h2 id="room-display-id" style="margin:5px 0; color:var(--secondary);">-----</h2>
    </div>
    <div id="player-list-sidebar"></div>
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
        <button onclick="socket.emit('toggleReady')" class="btn-glow" style="background:var(--success)">Ready Up</button>
        <div style="display:flex; gap:5px;">
            <button onclick="toggleModal('chat-modal')" class="btn-glow" style="flex:1; background:rgba(255,255,255,0.05);">Chat 💬</button>
            <button onclick="showRoomInfo()" class="info-btn-modern">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </button>
        </div>
    </div>
</aside>

<main id="main-stage">
    <div class="game-area">
        <div id="lobby-screen">
            <div id="host-controls" class="hidden">
                <h2>Host Settings</h2>
                <select id="win-points" class="modern-input"><option value="30">30 pts</option><option value="50">50 pts</option></select>
                <select id="round-timer" class="modern-input"><option value="30">30s</option><option value="60" selected>60s</option></select>
                <button onclick="startGame()" class="btn-glow">Start Match</button>
            </div>
            <p id="wait-msg" style="text-align:center;">Waiting for Host...</p>
        </div>

        <div id="game-screen" class="hidden">
            <div id="timer">60</div>
            <div id="clue-display" style="text-align:center; font-weight:bold; color:var(--primary); margin-bottom:15px;"></div>
            <div class="image-grid" id="grid"></div>
            <div id="controls">
                <div id="draw-ctrl" class="hidden">
                    <input type="text" id="clue-in" class="modern-input" placeholder="Enter clue...">
                    <button onclick="handleAction('submitClue')" class="btn-glow">Submit Clue</button>
                </div>
                <div id="fake-ctrl" class="hidden"><button onclick="handleAction('submitFake')" class="btn-glow">Confirm Fake</button></div>
                <div id="vote-ctrl" class="hidden"><button onclick="handleAction('submitVote')" class="btn-glow">Vote Now</button></div>
            </div>
        </div>
    </div>
</main>

<div id="chat-modal" class="modal">
    <div class="modal-content">
        <span onclick="toggleModal('chat-modal')" style="float:right; cursor:pointer;">✖</span>
        <h3>Chat</h3>
        <div id="chat-messages" style="height:200px; overflow-y:auto; margin-bottom:10px; background:rgba(0,0,0,0.2); padding:10px;"></div>
        <input type="text" id="chat-in" class="modern-input" placeholder="Type here...">
        <button onclick="sendChat()" class="btn-glow">Send</button>
    </div>
</div>

<div id="leaderboard-overlay" class="modal">
    <div class="modal-content">
        <h2 style="text-align:center">Game Over 🏆</h2>
        <div id="final-list"></div>
        <button onclick="location.reload()" class="btn-glow">Play Again</button>
    </div>
</div>

<script>
    const socket = io();
    let myId = localStorage.getItem('pix_uid') || 'u_'+Math.random().toString(36).substr(2,9);
    localStorage.setItem('pix_uid', myId);
    let selectedImg = null;
    let currentRoomId = "";

    function toggleJoinUI(isJoin) {
        document.getElementById('join-input-section').classList.toggle('hidden', !isJoin);
        document.getElementById('create-room-btn').classList.toggle('hidden', isJoin);
    }

    function joinGameAction(isCreate) {
        const n = document.getElementById('nick').value;
        const r = isCreate ? Math.random().toString(36).substring(2,7).toUpperCase() : document.getElementById('room-id-input').value.toUpperCase();
        if(!n || !r) return alert("Nickname and Room ID are required!");
        socket.emit('joinGame', { userId: myId, name: n, room: r });
        document.getElementById('name-screen').classList.add('hidden');
    }

    socket.on('initRoom', r => {
        currentRoomId = r;
        document.getElementById('room-display-id').innerText = r;
    });

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar');
        sL.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") {
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('wait-msg').classList.add('hidden');
        }
        d.players.forEach(id => {
            const dr = (id === d.currentDrawerId) ? "is-drawer" : "";
            sL.innerHTML += `<div class="player-card ${dr}" id="p-${id}">
                <span>${d.playerReady[id]?'✅':'⏳'} ${d.playerNames[id]}</span>
                <span class="score-badge">${d.scores[id]||0}</span>
            </div>`;
        });
    });

    socket.on('playerTyping', d => {
        const pCard = document.getElementById(`p-${d.userId}`);
        if(pCard) {
            if(d.isTyping && !pCard.querySelector('.typing-dot')) {
                pCard.insertAdjacentHTML('beforeend', '<span class="typing-dot">✍️</span>');
            } else if(!d.isTyping && pCard.querySelector('.typing-dot')) {
                pCard.querySelector('.typing-dot').remove();
            }
        }
    });

    ['chat-in', 'clue-in'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.oninput = () => socket.emit('typing', el.value.length > 0);
    });

    function startGame() {
        socket.emit('requestStart', { 
            targetPoints: document.getElementById('win-points').value, 
            roundTime: document.getElementById('round-timer').value, 
            mode: 'classic' 
        });
    }

    socket.on('roundStarted', d => {
        selectedImg = null;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        const isD = (myId === d.drawerId);
        document.getElementById('draw-ctrl').classList.toggle('hidden', !isD);
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.getElementById('clue-display').innerText = isD ? "YOUR TURN: PICK IMAGE & WRITE CLUE" : `Waiting for ${d.drawerName} to pick...`;
        if(d.images) render(d.images, isD);
    });

    socket.on('showClue', d => {
        document.getElementById('clue-display').innerText = `CLUE: ${d.clue}`;
        if(myId !== d.drawerId) {
            document.getElementById('fake-ctrl').classList.remove('hidden');
            if(d.pImages && d.pImages.length > 0) render(d.pImages, true);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('clue-display').innerText = `CLUE: ${document.getElementById('clue-display').innerText.split(': ')[1]} | VOTE NOW!`;
        if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden');
        render(d.options, (myId !== d.drawerId));
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const url = card.querySelector('img').getAttribute('src');
            let html = "";
            if(url === d.correctImage) {
                card.classList.add('correct');
                html += `<div class="reveal-header" style="background:var(--success); color:#000">ORIGINAL</div>`;
            } else if(d.fakers[url]) {
                card.style.borderColor = "var(--secondary)";
                html += `<div class="reveal-header" style="background:var(--secondary); color:#fff">${d.fakers[url]}'s Bait</div>`;
            }
            if(d.voteDetails[url]) html += `<div class="reveal-footer">👤 ${d.voteDetails[url].join(", ")}</div>`;
            card.insertAdjacentHTML('beforeend', html);
        });
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach((url, i) => {
            const c = document.createElement('div'); 
            c.className = 'image-card'; 
            c.innerHTML = `<img src="${url}">`;
            if(canSelect) c.onclick = () => {
                document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); 
                selectedImg = url;
            };
            g.appendChild(c);
            setTimeout(() => c.classList.add('reveal'), i * 100);
        });
    }

    function handleAction(t) {
        if(!selectedImg) return alert("Please select an image first!");
        if(t === 'submitClue') {
            const v = document.getElementById('clue-in').value;
            if(!v) return alert("Please write a clue!");
            socket.emit('submitClue', { image: selectedImg, clue: v });
            document.getElementById('draw-ctrl').classList.add('hidden');
        } else if(t === 'submitFake') {
            socket.emit('submitFake', selectedImg);
            document.getElementById('fake-ctrl').classList.add('hidden');
        } else if(t === 'submitVote') {
            socket.emit('submitVote', selectedImg);
            document.getElementById('vote-ctrl').classList.add('hidden');
        }
    }

    function toggleModal(id) { 
        const m = document.getElementById(id); 
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; 
    }

    function sendChat() { 
        const i = document.getElementById('chat-in'); 
        if(i.value) { 
            socket.emit('sendChat', i.value); 
            i.value = ""; 
            socket.emit('typing', false);
        } 
    }

    socket.on('newChat', d => { 
        const c = document.getElementById('chat-messages'); 
        c.innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`; 
        c.scrollTop = c.scrollHeight; 
    });

    socket.on('timerUpdate', t => {
        document.getElementById('timer').innerText = t;
    });

    socket.on('gameOver', d => {
        document.getElementById('leaderboard-overlay').style.display = 'flex';
        document.getElementById('final-list').innerHTML = d.leaderboard.map(p => 
            `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--glass)">
                <span>${p.name}</span><b>${p.score} pts</b>
            </div>`).join('');
    });

    function showRoomInfo() {
        alert("Share this Room ID with friends: " + currentRoomId);
    }
</script>
</body>
</html>
