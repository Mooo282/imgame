<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception | Rooms Version</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --card-bg: rgba(255, 255, 255, 0.07); --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255, 255, 255, 0.15); --success: #34d399; }
        * { box-sizing: border-box; transition: transform 0.3s, opacity 0.3s; }
        body { font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; overflow-x: hidden; background: linear-gradient(125deg, #0f0c29, #302b63, #24243e); color: white; display: flex; }
        #sidebar { width: 300px; background: rgba(0,0,0,0.5); backdrop-filter: blur(30px); border-right: 1px solid var(--glass); padding: 25px; display: flex; flex-direction: column; z-index: 100; }
        #player-list-sidebar { flex: 1; overflow-y: auto; }
        .player-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; border: 1px solid transparent; }
        .player-card.is-drawer { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .score-badge { border-radius: 20px; padding: 2px 10px; font-weight: 900; color: #000; font-size: 0.8em; }
        #main-stage { flex: 1; padding: 20px; position: relative; }
        .game-area { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass); border-radius: 35px; padding: 25px; max-width: 800px; margin: 0 auto; text-align: center; }
        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px auto; }
        .image-card { aspect-ratio: 1; border-radius: 20px; overflow: hidden; border: 4px solid transparent; cursor: pointer; position: relative; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); transform: scale(0.95); }
        .image-card.correct { border-color: var(--success); }
        .btn-glow { width: 100%; padding: 14px; border-radius: 15px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .modern-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass); background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; outline: none; text-align: center; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-content { background: var(--bg); border: 1px solid var(--glass); padding: 25px; border-radius: 30px; width: 90%; max-width: 400px; }
        .hidden { display: none !important; }
        #timer { font-size: 2.5em; font-weight: 900; color: var(--secondary); margin-bottom: 10px; }
        .low-time { color: #ff4757 !important; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<!-- شاشة الدخول واختيار الغرفة -->
<div id="setup-screen" style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; justify-content:center; align-items:center;">
    <div class="game-area" style="width:350px;">
        <h1 style="color:var(--primary)">PixDeception</h1>
        <input type="text" id="nick" class="modern-input" placeholder="Your Nickname">
        <div id="room-actions">
            <button onclick="createRoom()" class="btn-glow">Create New Room</button>
            <div style="margin: 15px 0; opacity: 0.5;">— OR —</div>
            <input type="text" id="room-code-input" class="modern-input" placeholder="Enter Room Code">
            <button onclick="joinRoom()" class="btn-glow" style="background:var(--secondary)">Join Room</button>
        </div>
    </div>
</div>

<aside id="sidebar" class="hidden">
    <h2 id="display-room-code" style="color:var(--primary); font-size: 1.2em; text-align: center; border: 1px dashed; padding: 5px;">CODE: ---</h2>
    <div id="player-list-sidebar"></div>
    <button onclick="socket.emit('toggleReady')" class="btn-glow" style="background:var(--success)">Ready Up</button>
    <button onclick="toggleModal('chat-modal')" class="btn-glow" style="background:rgba(255,255,255,0.1)">Chat 💬</button>
</aside>

<main id="main-stage" class="hidden">
    <div class="game-area">
        <div id="lobby-screen">
            <div id="host-controls" class="hidden">
                <h3>Host Settings</h3>
                <select id="game-mode" class="modern-input"><option value="classic">Standard</option><option value="fun">Server Version</option></select>
                <select id="win-points" class="modern-input"><option value="30">30 pts</option><option value="60">60 pts</option></select>
                <select id="round-timer" class="modern-input"><option value="60">60s</option><option value="30">30s</option></select>
                <button onclick="startGame()" class="btn-glow">Start Match</button>
            </div>
            <p id="wait-msg">Waiting for Host...</p>
        </div>

        <div id="game-screen" class="hidden">
            <div id="timer">60</div>
            <div id="clue-display" style="color:var(--primary); font-weight:bold; margin-bottom:10px;"></div>
            <div class="image-grid" id="grid"></div>
            <div id="controls">
                <div id="draw-ctrl" class="hidden">
                    <input type="text" id="clue-in" class="modern-input" placeholder="Clue...">
                    <button onclick="sendAction('submitClue')" class="btn-glow">Submit</button>
                </div>
                <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow" style="background:var(--secondary)">Confirm Fake</button></div>
                <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow" style="background:var(--success)">Vote Now</button></div>
            </div>
        </div>
    </div>
</main>

<!-- Modals -->
<div id="chat-modal" class="modal"><div class="modal-content"><h3>Chat</h3><div id="chat-messages" style="height:200px; overflow-y:auto; background:rgba(0,0,0,0.2); padding:10px; margin-bottom:10px;"></div><input type="text" id="chat-in" class="modern-input"><button onclick="sendChat()" class="btn-glow">Send</button><button onclick="toggleModal('chat-modal')" style="background:none; border:none; color:white; cursor:pointer; margin-top:10px;">Close</button></div></div>
<div id="leaderboard-overlay" class="modal"><div class="modal-content"><h2>Game Over 🏆</h2><div id="final-list"></div><button onclick="location.reload()" class="btn-glow">Play Again</button></div></div>

<script>
    const socket = io();
    let myId = localStorage.getItem('pix_uid') || 'u_'+Math.random().toString(36).substr(2,9);
    localStorage.setItem('pix_uid', myId);
    let selectedImg = null;
    let currentRoomCode = null;

    function getPlayerColor(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); return `hsl(${Math.abs(hash)%360}, 70%, 75%)`; }
    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }

    // إنشاء غرفة
    function createRoom() {
        const n = document.getElementById('nick').value;
        if(!n) return alert("Enter nickname!");
        socket.emit('createRoom', { userId: myId });
    }

    socket.on('roomCreated', code => {
        currentRoomCode = code;
        joinRoom(code);
    });

    // انضمام لغرفة
    function joinRoom(code) {
        const n = document.getElementById('nick').value;
        const c = code || document.getElementById('room-code-input').value.toUpperCase();
        if(!n || !c) return alert("Enter nickname and room code!");
        
        currentRoomCode = c;
        socket.emit('joinGame', { userId: myId, name: n, roomCode: c });
        
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('sidebar').classList.remove('hidden');
        document.getElementById('main-stage').classList.remove('hidden');
        document.getElementById('display-room-code').innerText = "CODE: " + c;
    }

    function startGame() {
        socket.emit('requestStart', { 
            targetPoints: document.getElementById('win-points').value, 
            roundTime: document.getElementById('round-timer').value, 
            mode: document.getElementById('game-mode').value 
        });
    }

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar');
        sL.innerHTML = "";
        
        // إظهار لوحة المضيف
        if (myId === d.hostId) {
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('wait-msg').classList.add('hidden');
        }

        d.players.forEach(id => {
            const ready = d.playerReady[id] ? "✅" : "⏳";
            const c = getPlayerColor(id);
            const dr = (id === d.currentDrawerId) ? "is-drawer" : "";
            sL.innerHTML += `<div class="player-card ${dr}"><span style="color:${c}">${ready} ${d.playerNames[id]}</span><span class="score-badge" style="background:${c}">${d.scores[id]||0}</span></div>`;
        });
    });

    socket.on('roundStarted', d => {
        selectedImg = null;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('clue-display').innerText = (myId === d.drawerId) ? "Your Turn: Select & Clue" : `Waiting for ${d.drawerName}...`;
        document.getElementById('draw-ctrl').className = (myId === d.drawerId) ? "" : "hidden";
        render(d.images, (myId === d.drawerId));
    });

    socket.on('showClue', d => {
        document.getElementById('clue-display').innerText = `CLUE: ${d.clue}`;
        if(myId !== d.drawerId) {
            document.getElementById('fake-ctrl').classList.remove('hidden');
            render(d.pImages, true);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('clue-display').innerText = "VOTE NOW!";
        if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden');
        render(d.options, (myId !== d.drawerId));
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const url = card.querySelector('img').getAttribute('src');
            if(url === d.correctImage) card.style.borderColor = "var(--success)";
            else if(d.fakers[url]) card.style.borderColor = "var(--secondary)";
        });
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach(url => {
            const c = document.createElement('div'); c.className = 'image-card';
            c.innerHTML = `<img src="${url}">`;
            if (canSelect) c.onclick = () => { 
                document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); selectedImg = url; 
            };
            g.appendChild(c);
        });
    }

    function sendAction(t) {
        if (!selectedImg) return alert("Select image!");
        const payload = { image: selectedImg };
        if (t === 'submitClue') payload.clue = document.getElementById('clue-in').value;
        socket.emit(t, payload);
        document.getElementById('draw-ctrl').classList.add('hidden');
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('vote-ctrl').classList.add('hidden');
    }

    function sendChat() { const i = document.getElementById('chat-in'); if(i.value) { socket.emit('sendChat', i.value); i.value = ""; } }
    socket.on('newChat', d => { 
        const c = document.getElementById('chat-messages'); 
        c.innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`;
        c.scrollTop = c.scrollHeight;
    });

    socket.on('timerUpdate', t => { 
        const el = document.getElementById('timer'); el.innerText = t; 
        if (t <= 10) el.classList.add('low-time'); else el.classList.remove('low-time');
    });

    socket.on('gameOver', d => {
        toggleModal('leaderboard-overlay');
        const l = document.getElementById('final-list'); l.innerHTML = d.leaderboard.map(p => `<div>${p.name}: ${p.score}</div>`).join('');
    });

    socket.on('error', msg => alert(msg));
</script>
</body>
</html>
