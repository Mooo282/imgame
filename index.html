<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixDeception | Server Version</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f0c29; --card-bg: rgba(255, 255, 255, 0.08); --primary: #a78bfa; --secondary: #f472b6; --glass: rgba(255, 255, 255, 0.12); --success: #34d399; }
        * { box-sizing: border-box; transition: 0.3s; }
        body { font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; background: linear-gradient(125deg, #0f0c29, #302b63, #24243e); background-size: 400% 400%; animation: dreamGradient 15s ease infinite; display: flex; color: white; }
        @keyframes dreamGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        #sidebar { width: 300px; background: rgba(0,0,0,0.5); backdrop-filter: blur(30px); border-right: 1px solid var(--glass); padding: 25px; display: flex; flex-direction: column; z-index: 100; }
        #player-list-sidebar { flex: 1; overflow-y: auto; }
        .player-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; font-size: 0.85em; }
        .player-card.is-drawer { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .score-badge { border-radius: 20px; padding: 2px 10px; font-weight: 900; color: #000; font-size: 0.8em; }

        #main-stage { flex: 1; padding: 20px; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; padding-bottom: 120px; }
        .game-area { background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass); border-radius: 35px; padding: 25px; max-width: 900px; margin: 0 auto; }

        .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px auto; }
        .image-card { aspect-ratio: 1; border-radius: 25px; overflow: hidden; position: relative; border: 4px solid transparent; cursor: pointer; }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }
        .image-card.selected { border-color: var(--primary); transform: scale(0.96); }
        .image-card.correct { border-color: var(--success); }

        .btn-glow { width: 100%; padding: 14px; border-radius: 15px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.8em; }
        .modern-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass); background: rgba(0,0,0,0.2); color: white; margin-bottom: 10px; outline: none; }
        #timer { font-size: 3em; font-weight: 900; color: var(--secondary); text-align: center; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-content { background: var(--bg); border: 1px solid var(--glass); padding: 25px; border-radius: 30px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; position: relative; }
        
        .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 12, 41, 0.9); padding: 15px; display: none; justify-content: space-around; z-index: 4000; border-top: 1px solid var(--glass); }
        .nav-btn { width: 55px; height: 55px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass); color: white; font-size: 20px; }

        @media (max-width: 900px) {
            #sidebar { display: none; }
            .mobile-nav { display: flex; }
            .image-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
        .hidden { display: none !important; }
        .reveal-header { position: absolute; top: 0; left: 0; right: 0; font-size: 10px; font-weight: 900; text-align: center; color: #000; padding: 4px; z-index: 10; }
        .reveal-footer { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); color: #fff; font-size: 9px; padding: 5px; text-align: center; z-index: 10; }
    </style>
</head>
<body>

<div id="name-screen" style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; justify-content:center; align-items:center;">
    <div class="game-area" style="width:300px; text-align:center;">
        <h1>PixDeception</h1>
        <input type="text" id="nick" class="modern-input" placeholder="Nickname...">
        <button onclick="join()" class="btn-glow">Enter Game</button>
    </div>
</div>

<aside id="sidebar">
    <h2 style="color:var(--primary);">Dreamers</h2>
    <div id="player-list-sidebar"></div>
    <div style="margin-top:auto;">
        <button onclick="socket.emit('toggleReady')" class="btn-glow" style="margin-bottom:10px; background:var(--success)">Ready Up</button>
        <button onclick="toggleModal('chat-modal')" class="btn-glow" style="background:rgba(255,255,255,0.05);">Chat 💬</button>
    </div>
</aside>

<main id="main-stage">
    <div class="game-area">
        <div id="lobby-screen" class="hidden">
            <div id="host-controls" class="hidden">
                <h2>Host Panel</h2>
                <select id="game-mode" class="modern-input"><option value="classic">Standard</option><option value="fun">Server Version</option></select>
                <select id="win-points" class="modern-input"><option value="30">30 pts</option><option value="60">60 pts</option></select>
                <select id="round-timer" class="modern-input"><option value="60">60s</option><option value="30">30s</option></select>
                <button onclick="startGame()" class="btn-glow">Start Match</button>
            </div>
            <p id="wait-msg" style="text-align:center;">Waiting for Host to start...</p>
        </div>

        <div id="game-screen" class="hidden">
            <div id="timer">60</div>
            <div id="clue-display" style="text-align:center; font-weight:bold; color:var(--primary); font-size:1.2em; margin-bottom:15px;"></div>
            <div class="image-grid" id="grid"></div>
            <div id="controls">
                <div id="draw-ctrl" class="hidden"><input type="text" id="clue-in" class="modern-input" placeholder="Enter clue..."><button onclick="sendAction('submitClue')" class="btn-glow">Submit Clue</button></div>
                <div id="fake-ctrl" class="hidden"><button onclick="sendAction('submitFake')" class="btn-glow" style="background:var(--secondary)">Confirm Fake</button></div>
                <div id="vote-ctrl" class="hidden"><button onclick="sendAction('submitVote')" class="btn-glow" style="background:var(--success)">Vote Now</button></div>
            </div>
        </div>
    </div>
</main>

<div class="mobile-nav">
    <button class="nav-btn" onclick="toggleModal('players-modal')">👤</button>
    <button class="nav-btn" onclick="toggleModal('chat-modal')">💬</button>
    <button class="nav-btn" onclick="socket.emit('toggleReady')">✅</button>
</div>

<div id="chat-modal" class="modal"><div class="modal-content"><span onclick="toggleModal('chat-modal')" style="float:right; cursor:pointer;">✖</span><h3>Chat</h3><div id="chat-messages" style="height:200px; overflow-y:auto; background:rgba(0,0,0,0.2); padding:10px; margin-bottom:10px;"></div><div style="display:flex; gap:5px;"><input type="text" id="chat-in" class="modern-input"><button onclick="sendChat()" class="btn-glow" style="width:60px;">Go</button></div></div></div>
<div id="players-modal" class="modal"><div class="modal-content"><span onclick="toggleModal('players-modal')" style="float:right; cursor:pointer;">✖</span><h3>Players</h3><div id="player-list-mobile"></div></div></div>
<div id="leaderboard-overlay" class="modal"><div class="modal-content"><h2>Game Over 🏆</h2><div id="final-list"></div><button onclick="location.reload()" class="btn-glow">Play Again</button></div></div>

<script>
    const socket = io();
    let myId = localStorage.getItem('pix_uid') || 'u_'+Math.random().toString(36).substr(2,9);
    localStorage.setItem('pix_uid', myId);
    let selectedImg = null;

    function getPlayerColor(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash); return `hsl(${Math.abs(hash)%360}, 70%, 75%)`; }
    function toggleModal(id) { const m = document.getElementById(id); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    
    function join() {
        const n = document.getElementById('nick').value;
        if(!n) return;
        localStorage.setItem('pix_name', n);
        socket.emit('joinGame', { userId: myId, name: n });
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    if(localStorage.getItem('pix_name')) { document.getElementById('nick').value = localStorage.getItem('pix_name'); join(); }

    function startGame() { 
        socket.emit('requestStart', { 
            targetPoints: document.getElementById('win-points').value, 
            roundTime: document.getElementById('round-timer').value, 
            mode: document.getElementById('game-mode').value 
        }); 
    }

    socket.on('updatePlayerList', d => {
        const sL = document.getElementById('player-list-sidebar');
        const mL = document.getElementById('player-list-mobile');
        sL.innerHTML = mL.innerHTML = "";
        if (myId === d.hostId && d.gameState === "LOBBY") document.getElementById('host-controls').classList.remove('hidden');
        
        d.players.forEach(id => {
            const ready = d.playerReady[id] ? "✅" : "⏳";
            const c = getPlayerColor(id);
            const dr = (id === d.currentDrawerId && d.gameState !== "LOBBY") ? "is-drawer" : "";
            const h = `<div class="player-card ${dr}"><span style="color:${c}">${ready} ${d.playerNames[id]}</span><span class="score-badge" style="background:${c}">${d.scores[id]||0}</span></div>`;
            sL.innerHTML += h; mL.innerHTML += h;
        });
    });

    socket.on('roundStarted', d => {
        selectedImg = null;
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('clue-display').innerText = (myId === d.drawerId) ? "Your Turn: Select & Clue" : `Waiting for ${d.drawerName}...`;
        document.getElementById('draw-ctrl').className = (myId === d.drawerId) ? "" : "hidden";
        render(d.images, (myId === d.drawerId));
    });

    socket.on('showClue', d => {
        document.getElementById('clue-display').innerText = `CLUE: ${d.clue}`;
        if(myId !== d.drawerId) {
            document.getElementById('fake-ctrl').classList.remove('hidden');
            if(d.pImages && d.pImages.length > 0) render(d.pImages, true);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('fake-ctrl').classList.add('hidden');
        document.getElementById('clue-display').innerText = "VOTE NOW!";
        if(myId !== d.drawerId) document.getElementById('vote-ctrl').classList.remove('hidden');
        render(d.options, (myId !== d.drawerId));
    });

    socket.on('roundFinished', d => {
        document.getElementById('vote-ctrl').classList.add('hidden');
        document.querySelectorAll('.image-card').forEach(card => {
            const url = card.querySelector('img').getAttribute('src');
            let html = "";
            if(url === d.correctImage) {
                card.classList.add('correct');
                html += `<div class="reveal-header" style="background:var(--success)">Correct!</div>`;
            } else if(d.fakers[url]) {
                card.style.borderColor = "var(--secondary)";
                html += `<div class="reveal-header" style="background:var(--secondary); color:#fff">${d.fakers[url]}</div>`;
            }
            if(d.voteDetails[url]) html += `<div class="reveal-footer">${d.voteDetails[url].join(", ")}</div>`;
            card.insertAdjacentHTML('beforeend', html);
        });
    });

    function render(images, canSelect) {
        const g = document.getElementById('grid'); g.innerHTML = "";
        images.forEach(url => {
            const c = document.createElement('div'); c.className = 'image-card';
            c.innerHTML = `<img src="${url}">`;
            if (canSelect) c.onclick = () => { 
                document.querySelectorAll('.image-card').forEach(x => x.classList.remove('selected'));
                c.classList.add('selected'); selectedImg = url; 
            };
            g.appendChild(c);
        });
    }

    function sendAction(t) {
        if (!selectedImg) return alert("Pick an image!");
        if (t === 'submitClue') {
            const val = document.getElementById('clue-in').value;
            if(!val) return alert("Write a clue!");
            socket.emit('submitClue', { image: selectedImg, clue: val });
            document.getElementById('draw-ctrl').classList.add('hidden');
        } else if (t === 'submitFake') {
            socket.emit('submitFake', selectedImg);
            document.getElementById('fake-ctrl').classList.add('hidden');
        } else if (t === 'submitVote') {
            socket.emit('submitVote', selectedImg);
            document.getElementById('vote-ctrl').classList.add('hidden');
        }
    }

    function sendChat() { const i = document.getElementById('chat-in'); if(i.value) { socket.emit('sendChat', i.value); i.value = ""; } }
    socket.on('newChat', d => { 
        const c = document.getElementById('chat-messages'); 
        c.innerHTML += `<div><b>${d.sender}:</b> ${d.text}</div>`;
        c.scrollTop = c.scrollHeight;
    });
    socket.on('timerUpdate', t => { document.getElementById('timer').innerText = t; });
    socket.on('gameOver', d => {
        toggleModal('leaderboard-overlay');
        const l = document.getElementById('final-list'); l.innerHTML = "";
        d.leaderboard.forEach(p => l.innerHTML += `<div style="display:flex;justify-content:space-between;padding:10px;"><span>${p.name}</span><b>${p.score}</b></div>`);
    });
</script>
</body>
</html>
